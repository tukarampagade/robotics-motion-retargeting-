<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Random Joke Generator</h1>
      <section class="joke-card" aria-live="polite">
        <p id="setup" class="setup">Loading joke...</p>
        <p id="punchline" class="punchline"></p>
        <p id="error" class="error" role="alert"></p>
      </section>
      <button id="new-joke-btn" type="button">New Joke</button>
      <p id="loading" class="loading" hidden>Loading...</p>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
